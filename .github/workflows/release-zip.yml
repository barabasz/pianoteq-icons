# Attach a ZIP with the ready-to-use icons to every published release.
name: Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build the ZIP for, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build ZIP from icons/
        run: |
          NAME="pianoteq-icons-${TAG}"
          mkdir -p "dist/${NAME}"
          cp -r icons/. "dist/${NAME}/"
          cp LICENSE "dist/${NAME}/LICENSE.txt"
          (cd dist && zip -qr "${NAME}.zip" "${NAME}")
          echo "Files in ZIP: $(unzip -Z1 "dist/${NAME}.zip" | grep -c '\.png$') PNG"
          echo "ZIP=dist/${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
